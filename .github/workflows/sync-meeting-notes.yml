name: Sync meeting notes

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # lets the job federate into Google Cloud (Workload Identity Federation)

concurrency:
  group: sync-meeting-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/796873480798/locations/global/workloadIdentityPools/github-actions/providers/github
      - name: Copy new Gemini notes from Drive
        env:
          SERVICE_ACCOUNT_EMAIL: meeting-notes-sync@main-entropy-495701-p6.iam.gserviceaccount.com
        run: python scripts/sync_meeting_notes.py
      - run: python scripts/build-meeting-index.py
      - name: Commit and push
        run: |
          git config user.name "meeting-notes-bot"
          git config user.email "meeting-notes-bot@users.noreply.github.com"
          git add meeting-notes
          if git diff --cached --quiet; then echo "no new notes"; exit 0; fi
          git commit -m "Sync meeting notes from Google Drive"
          git pull --rebase
          git push
